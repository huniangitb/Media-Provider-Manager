name: Android CI Build

on:
  push:
    branches: [ main, Re, develop, test, migrate-libxposed-api ]
  pull_request:
    branches: [ main, Re, develop, test, migrate-libxposed-api ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable Gradle build cache
        run: |
          mkdir -p ~/.gradle/caches
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.caching.debug=false" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties

      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/configuration-cache/
          key: ${{ runner.os }}-gradle-build-${{ hashFiles('**/*.kt', '**/*.java', '**/*.c', '**/*.h', '**/*.cpp', '**/build.gradle.kts', '**/build.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MPM-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          archive: false
